name: DCO

on:
  pull_request:

permissions:
  contents: read

# Аппарат лицензируется на тех же условиях, что платформа: курс награждает
# студентов за вклад, а права на их код по умолчанию остаются за ними. DCO
# фиксирует, что автор вправе передать код на условиях проекта.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Signed-off-by в каждом коммите PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            if git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              continue
            fi

            echo "::error::Нет Signed-off-by: ${sha:0:8} \"$subject\" ($author)"
            missing=1
          done < <(git rev-list --no-merges "$BASE..$HEAD")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Каждый коммит должен удостоверять Developer Certificate of Origin."
            echo "Добавьте подпись: git commit -s   (или git rebase --signoff $BASE)"
            exit 1
          fi

          echo "Все коммиты подписаны."
